services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paymentsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - quickpay-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d paymentsdb" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        # file-parser-core is not on Maven Central; give the build the copy from the host's local Maven repo.
        m2local: ${HOME}/.m2/repository/com/progressoft/training
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres,liquibase
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: paymentsdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PAYMENTS_NOTES_MAX_LENGTH: "20"
      PAYMENTS_ALLOWED_CURRENCIES: "JOD,USD"
      PAYMENTS_PERSIST_DB_ON_ERROR: "true"
    depends_on:
      db:
        condition: service_healthy

  # Dev mode only (docker compose --profile dev up --build): Angular dev server on 4200,
  # proxying /api to the backend container by its service name (app).
  frontend:
    profiles: ["dev"]
    image: node:24
    working_dir: /app
    command: sh -c "npm ci && npx ng serve --host 0.0.0.0 --proxy-config proxy.conf.docker.json"
    environment:
      NG_CLI_ANALYTICS: "false"
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-ng-cache:/app/.angular
    depends_on:
      - app

volumes:
  quickpay-db-data:
  frontend-node-modules:
  frontend-ng-cache: